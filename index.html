<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 Global Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    
    /* Animations */
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-pulse-slow {
      animation: pulse-slow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    
    @keyframes tick-fade {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }
    .animate-tick {
      animation: tick-fade 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes slide-up {
      0% { transform: translateY(10%); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    @keyframes pop-in {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: pop-in 0.2s ease-out;
    }

    /* Liquid Blobs Animation */
    @keyframes drift {
      0% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(30px, -50px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    
    .animate-drift {
      animation: drift 20s infinite ease-in-out;
    }
    
    .animate-drift-delayed {
      animation: drift 25s infinite ease-in-out reverse;
    }

    /* Gradient Text Utilities */
    .text-gradient-gold {
      background: linear-gradient(to bottom, #fcd34d, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
